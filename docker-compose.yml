version: '3.8'

# ==============================================================================
# GitLab Engineering Reliability Intelligence Platform - Docker Compose Stack
# ==============================================================================
# Services:
#   1. db        - PostgreSQL 16 relational database with persistent storage
#   2. backend   - Node.js Express REST API, code intelligence & analysis engine
#   3. frontend  - Production React SPA served via Nginx reverse proxy (port 80)
# ==============================================================================

services:
  # --- Database Service ---
  db:
    image: postgres:16-alpine
    container_name: gitlab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-gitlab_intelligence}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gitlab_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gitlab_network

  # --- Backend API Service ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gitlab_backend
    restart: unless-stopped
    command: sh -c "npm run migrate && npm start"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-gitlab_intelligence}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      SESSION_SECRET: ${SESSION_SECRET:-production-ready-secure-session-secret-change-me-32b}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-1000}
    ports:
      - "4000:4000"
    volumes:
      - backend_storage:/app/storage
    networks:
      - gitlab_network

  # --- Frontend Static Service (Nginx) ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitlab_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - gitlab_network

# --- Persistent Storage Volumes ---
volumes:
  postgres_data:
    name: gitlab_postgres_data
  backend_storage:
    name: gitlab_backend_storage

# --- Isolated Bridge Network ---
networks:
  gitlab_network:
    name: gitlab_network
    driver: bridge
